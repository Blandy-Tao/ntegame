    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo-link"><div class="logo">NTE Hub</div></a>
            <div class="nav-links">
                <a href="index.html">主页</a>
                <a href="characters.html">角色</a>
                <a href="beginner-guide.html">新手指南</a>
                <a href="combat.html">战斗</a>
                <a href="events.html">活动</a>
                <a href="wiki.html">Wiki</a>
            </div>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
        <div class="mobile-nav">
            <div class="mobile-nav-links">
                <a href="index.html">主页</a>
                <a href="characters.html">角色</a>

                <a href="wiki.html">Wiki</a>
            </div>
        </div>
    </nav>

    <!-- Wiki Page -->
    <section class="wiki-page">
        <h2 class="section-title">Wiki资源</h2>
        
        <div class="search-bar">
            <input type="text" placeholder="搜索Wiki...">
        </div>

        <div class="tabs-container">
            <button class="tab-button active" data-target="materials">材料地图</button>
            <button class="tab-button" data-target="equipment">装备数据库</button>
        </div>

        <div id="materials" class="tab-content">
            <div class="map-container">
                <img src="https://placehold.co/1200x675/0B0F19/00F0FF?text=材料地图%20-%20资源位置" alt="材料地图">
            </div>
            <p style="text-align: center; margin-top: 1.5rem; color: rgba(255, 255, 255, 0.7);">
                交互式地图显示新烬城各地的资源位置。点击标记查看材料类型和重生时间。
            </p>
        </div>

        <div id="equipment" class="tab-content" style="display: none;">
            <div class="equipment-database">
                <div class="equipment-card">
                    <div class="equipment-icon"><i class="fas fa-circle"></i></div>
                    <div class="equipment-name">弧盘</div>
                    <div class="equipment-desc">主要武器槽位，决定基础攻击属性。</div>
                </div>
                <div class="equipment-card">
                    <div class="equipment-icon"><i class="fas fa-shield"></i></div>
                    <div class="equipment-name">空幕</div>
                    <div class="equipment-desc">护甲部件，提供防御和特殊加成。</div>
                </div>
                <div class="equipment-card">
                    <div class="equipment-icon"><i class="fas fa-music"></i></div>
                    <div class="equipment-name">卡带</div>
                    <div class="equipment-desc">饰品，增强技能效果和轨道能力。</div>
                </div>
                <div class="equipment-card">
                    <div class="equipment-icon"><i class="fas fa-battery-full"></i></div>
                    <div class="equipment-name">驱动核心</div>
                    <div class="equipment-desc">核心组件，为特殊技能和终极攻击提供能量。</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="#" target="_blank"><i class="fab fa-discord"></i></a>
